<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">
    <title>Mirador Example</title>
  </head>
  <body>
    <div id="viewer"></div>
    
    <script src="./mirador/dist/mirador-with-plugins.js"></script>
    <script>
      class MockAnnotationAdapter {
        constructor(canvasId) {
          this.canvasId = canvasId;
          this.annotations = new Map();
        }
        async create(annotation) {
          const id = annotation.id || `anno-${Date.now()}`;
          this.annotations.set(id, { ...annotation, id });
          console.log('[Annotations] Created:', id);
          return this.annotations.get(id);
        }
        async update(annotation) {
          if (!this.annotations.has(annotation.id)) throw new Error('Not found');
          this.annotations.set(annotation.id, annotation);
          console.log('[Annotations] Updated:', annotation.id);
          return annotation;
        }
        async delete(annotationId) {
          this.annotations.delete(annotationId);
          console.log('[Annotations] Deleted:', annotationId);
        }
        async get(annotationId) {
          return this.annotations.get(annotationId);
        }
        async all() {
          return Array.from(this.annotations.values());
        }
      }
      
      const {Mirador, MiradorPlugins} = window.MiradorWithPlugins;
      
      const config = {
        id: 'viewer',
        windows: [{
          imageToolsEnabled: true,
          imageToolsOpen: true,
          manifestId: 'http://localhost:8000/iiif/manifest/pyritised-ammonite.json',
        }],
        annotation: {
          adapter: (canvasId) => new MockAnnotationAdapter(canvasId),
          exportLocalStorageAnnotations: false
        },
        requests: {
          preprocessors: [
            (url, options) => ({...options,
              headers: {
                ...options.headers,
                Accept: url.endsWith('/info.json')
                        ? 'application/ld+json;profile=http://iiif.io/api/image/3/context.json'
                        : 'application/ld+json;profile="http://iiif.io/api/presentation/3/context.json"'
              }
            })
          ],
        },
        theme: {
          palette: { primary: { main: '#1967d2' } }
        },
        osdConfig:{
          crossOriginPolicy: "Anonymous",
          subPixelRoundingForTransparency: 2,
          immediateRender: true,
        },
      };

      Mirador.viewer(config, Object.values(MiradorPlugins).flatMap((e) => ([...e])));
    </script>
  </body>
</html>
